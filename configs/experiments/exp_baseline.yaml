# Línea base de umbral. Comparte partición, ventanas y episodios con rf_main.

name: baseline_main
role: main
seed: 42
data_config: configs/data.yaml
features_config: configs/features.yaml
split_file: configs/splits/caso_B.json

target: binary

window:
  W_seconds: 5.0                # = rf_main (Gate D)
  S_seconds: 1.0
  k: 1

alerts:
  max_gap_seconds: 1.0          # = rf_main

model:
  type: threshold
  feature: n_disconn            # o rate_disconn

threshold:
  criterion: max_f1_validation  # empate: menor umbral

mitigation:
  tau_high: 0.9                 # = rf_main
  cooldown_seconds: 30.0
