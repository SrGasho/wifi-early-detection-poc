# Línea base de umbral para Caso C disas->deauth. Comparte partición y ventanas con loao_disas_to_deauth.
name: baseline_disas_to_deauth
role: main
seed: 42
data_config: configs/data.yaml
features_config: configs/features.yaml
split_file: configs/splits/caso_C_disas_to_deauth.json

target: binary

window:
  W_seconds: 5.0
  S_seconds: 1.0
  k: 1

split:
  case: C
  train_attack: disas
  test_attack: deauth
  val_fraction: 0.2
  purge_seconds: 10.0
  max_W_seconds: 10.0

episodes:
  T_method: fixed
  T_seconds: 2.0

alerts:
  max_gap_seconds: 1.0

model:
  type: threshold
  feature: n_disconn

threshold:
  criterion: max_f1_validation

mitigation:
  tau_high: 0.9
  cooldown_seconds: 30.0
