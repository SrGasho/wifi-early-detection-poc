# Experimento PRINCIPAL de Random Forest. Es el único, junto con la línea base, que llega a la prueba.
# Todo valor < > se fija en Gate D y se registra en docs/decisiones.md.

name: rf_main
role: main
seed: 42
data_config: configs/data.yaml
features_config: configs/features.yaml
split_file: configs/splits/caso_B.json

target: binary                  # normal frente a ataque de desconexión (R11)

window:
  W_seconds: 5.0                # Gate D 2.3
  S_seconds: 1.0                # Gate D 2.3 (resolución del dato = 1 s)
  k: 1                          # fijo (R5)

# Partición (la congela split_data --freeze con ESTE archivo).
split:
  case: B                       # Gate D: Caso B (1 captura por ataque)
  purge_seconds: 10.0           # Gate D 2.4 (>= mayor W de sensibilidad, R7)
  max_W_seconds: 10.0           # mayor W de los experimentos de sensibilidad
  proportions: [0.6, 0.2, 0.2]  # fracción de tramas objetivo por conjunto
  snap_to_silence: true         # mover cortes a silencios entre ráfagas exploratorias

episodes:
  T_method: fixed               # Gate D 2.5 (percentile degenera con IAT ~0)
  T_seconds: 2.0

alerts:
  max_gap_seconds: 1.0          # Gate D 2.5 (= S)

model:
  type: random_forest
  grid:
    n_estimators: [100, 300]
    max_depth: [null, 10, 20]
    min_samples_leaf: [1, 5]
  class_weight: balanced

imputation:
  strategy: constant            # constant | train_median
  value: -1

threshold:
  criterion: max_f1_validation

features_profile: allowed

mitigation:                     # no afecta ninguna métrica de detección
  tau_high: 0.9                 # Gate D 2.8 (supuesto de simulación)
  cooldown_seconds: 30.0
